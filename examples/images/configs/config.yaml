    bbox_model:  grid #grid | superpixel | saliency
    path: datasets/varia

display:
  monitor: 
    name: spectrum_monitor
    resolution:
      - 1920 #3440
      - 1200 #1440
    width: 35
    distance: 60
    display_number: 0
  gui:
    button:
      size:
        - 250
        - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30
    fixation_dot: 
      size: 10
      color: white
    aoe:
      - 750
      - 750

output:
  folder: output

