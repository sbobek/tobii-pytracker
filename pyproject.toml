[build-system]
requires = ["setuptools>=61,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tobii-pytracker"
version = "1.0.0"
description = "A Python-based framework for Tobii eye tracker experiments and multimodal interaction."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [
  { name = "Szymon Bobek", email = "szymon.bobek@gmail.com" },
  { name = "Sebastian Sęczyk", email = "sebastian.seczyk@gmail.com" },
  { name = "Jakub Pleśniak", email = "jakubpl2001@gmail.com" }
  { name = "Dmytro Polishchuk", email = "dmitro.polischuk@gmail.com" }
]
dependencies = [
  "six==1.16.0",
  "packaging==24.0",
  "PyYAML==6.0.1",
  "pyserial==3.5",
  "scipy==1.13.1",
  "json_tricks==3.17.3",
  "requests==2.32.2",
  "Pillow==10.3.0",
  "python-bidi==0.4.2",
  "pandas==2.2.2",
  "arabic_reshaper==3.0.0",
  "freetype-py==2.4.0",
  "matplotlib==3.9.0",
  "psutil==5.9.8",
  "gevent==24.2.1",
  "msgpack==1.0.8",
  "ultralytics<8.4",
  "numpy==1.26.4",
  "msgpack_numpy==0.4.8",
  "scikit-learn==1.7.2",
  "psychopy-eyetracker-tobii==0.0.3",
  "tobii-research==2.0.0",
  "scikit-image>=0.25.2",
  "setuptools<=66.1.1",
  "openai-whisper>=20250625",
  'sounddevice==0.5.3',
  'soundfile==0.13.1',
  'pyglet==1.5.27; platform_system == "Linux"',
  'pyglet==1.4.11; platform_system == "Windows"',
  'pywin32==311; platform_system == "Windows"',
  'pyWinhook==1.6.2; platform_system == "Windows"'
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

[project.scripts]
tobii-pytracker = "tobii_pytracker.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tobii_pytracker*"]

