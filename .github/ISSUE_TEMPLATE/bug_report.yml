name: Bug report
description: Report a reproducible problem with Tobii-PyTracker
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem with Tobii-PyTracker. Please provide enough information to reproduce and diagnose the issue. Do not include participant data or other sensitive information.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of Tobii-PyTracker is affected?
      options:
        - Experiment or stimulus presentation
        - Eye-tracker connection or gaze recording
        - Mouse eye-tracker emulation
        - Voice recording
        - Data loading or analysis
        - Command-line interface
        - Configuration
        - Documentation or examples
        - Installation or packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Clearly describe the problem and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproducible example, including the command used and relevant configuration values. Remove paths, recordings, and data that should not be public.
      placeholder: |
        1. Install ...
        2. Configure ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: Tobii-PyTracker version
      description: Provide the installed version or commit hash.
      placeholder: "For example: 0.1.0 or commit abc1234"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "For example: 3.10.14"
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: "For example: Ubuntu 24.04 or Windows 11"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime environment
      options:
        - Native Linux
        - Native Windows
        - Native macOS
        - Docker
        - WSL or WSLg
        - Virtual machine
        - Other
    validations:
      required: true

  - type: input
    id: tracker
    attributes:
      label: Eye tracker or emulator
      description: State the device model, mouse emulator, or that eye tracking was disabled.
      placeholder: "For example: Tobii Pro Spark, mouse emulator, or disabled"

  - type: textarea
    id: dependencies
    attributes:
      label: Relevant dependency versions
      description: List versions that may be related to the problem, such as PsychoPy, iohub, or audio and display dependencies.

  - type: textarea
    id: logs
    attributes:
      label: Error message, traceback, or logs
      description: Paste the complete error output or a focused log excerpt. Remove sensitive data.
      render: shell

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots or other relevant information. Do not attach participant recordings or confidential data.
